name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root + workspaces)
        run: npm ci

      - name: Generate app icon
        run: npm run generate:favicons

      - name: Build Electron app (server + client + electron-builder)
        run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\iscc.exe" installer\patent-workbench.iss'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/PatentWorkbench-setup.exe
          generate_release_notes: true
