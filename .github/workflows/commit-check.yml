name: Pull request verification

on:
  pull_request:
    branches:
      - develop
      - master

  # Allow manual runs
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  node_lint:
    name: Node.js Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm setup

      - name: Lint (Javascript, Markdown, SCSS, HTML)
        run: npm run lint --if-present

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: node_lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root deps
        run: npm setup

      - name: Build server
        working-directory: server
        run: |
          npm setup
          npm run build --if-present